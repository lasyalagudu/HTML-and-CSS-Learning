<html>
    <head>
        <title>Exercises</title>
        <style>
            .uber{
                color:white;
                background-color: black;
                border:none;
                width: 120px;
                height: 40px;
                font-weight: bold;
                margin-right: 50px;
                cursor: pointer;
            }
            .uber:hover{
                background-color: rgb(75, 74, 74);
            }
            .amazon{
                background-color: rgb(252, 219, 5);
                border:none;
                border-radius: 50px; 
                width: 150px;
                height: 40px;
            }
            .amazon:hover{
                background-color: rgb(252, 226, 76);
            }
        </style>
    </head>
    <body>
        <button class="uber">Request now</button>
        <button class="amazon">Add to Cart</button>
    </body>
</html>
